name: LLMOps CI/CD

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:
    inputs:
      full_eval:
        description: "Run all evaluation cases (default: the 6 critical cases)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  # CPU-only torch wheels (sentence-transformers) instead of ~2.5 GB of CUDA libs
  PIP_EXTRA_INDEX_URL: "https://download.pytorch.org/whl/cpu"
  # Upstream langfuse/langfuse commit whose docker-compose.yml runs the ephemeral Langfuse v4
  LANGFUSE_COMPOSE_REF: "f75c661dbe8c6b85523c81486b39e8403ac2c141"

jobs:
  # ═══ Stage 1 · Code quality & security ═════════════════════════════════════
  lint:
    name: "Quality · Lint (ruff check)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install "$(grep -E '^ruff==' requirements.lock)"
      - name: ruff check (no auto-fix in CI)
        run: ruff check . --output-format=github

  format:
    name: "Quality · Format (ruff format --check)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install "$(grep -E '^ruff==' requirements.lock)"
      - name: ruff format --check
        run: ruff format --check --diff .

  secret-scan:
    name: "Security · Secret scan (gitleaks, full history)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks detect
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.18.4 \
            detect --source /repo --redact --no-banner -v

  dependency-audit:
    name: "Security · Dependency audit (pip-audit, advisory)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install pip-audit==2.7.3
      - name: Audit requirements.lock against known vulnerabilities
        # Advisory: findings are reported as warnings and in the job summary but do not
        # block the pipeline (upgrades of pinned LLM libraries need their own validation)
        run: |
          set +e
          pip-audit -r requirements.lock --disable-pip --no-deps -f markdown -o audit.md
          code=$?
          set -e
          { echo "## Dependency audit (advisory)"; echo; cat audit.md 2>/dev/null || echo "no report"; } >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" -ne 0 ]; then
            n=$(grep -cE '^\|' audit.md 2>/dev/null || echo 0)
            echo "::warning title=Dependency audit::pip-audit reported vulnerable pins (see job summary, ~$((n>2 ? n-2 : 0)) rows)"
          else
            echo "::notice title=Dependency audit::no known vulnerabilities in requirements.lock"
          fi

  # ═══ Stage 2 · Unit tests (one job per suite) ══════════════════════════════
  unit:
    name: "Unit tests · ${{ matrix.suite.name }}"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite:
          - { name: "Agent core", slug: "agent-core", path: "tests/test_agent.py" }
          - { name: "Regression fixes", slug: "regressions", path: "tests/test_regressions.py" }
          - { name: "Monitoring & quality gate", slug: "monitoring", path: "tests/test_monitoring.py" }
          - { name: "Evaluation suite logic", slug: "eval-suite", path: "tests/test_eval_suite.py" }
          - { name: "CI scripts", slug: "scripts", path: "tests/test_scripts.py" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked dependencies
        run: pip install -r requirements.lock
      - name: pytest ${{ matrix.suite.path }}
        env:
          COVERAGE_FILE: reports/.coverage.${{ matrix.suite.slug }}
        run: |
          mkdir -p reports
          python -m pytest ${{ matrix.suite.path }} --junitxml=reports/junit-${{ matrix.suite.slug }}.xml \
            --cov=. --cov-report=
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-${{ matrix.suite.slug }}
          path: reports/
          include-hidden-files: true
          if-no-files-found: warn

  test-report:
    name: "Unit tests · Report & coverage"
    needs: unit
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install "$(grep -E '^coverage==' requirements.lock)"
      - uses: actions/download-artifact@v4
        with:
          pattern: unit-*
          path: unit-results
          merge-multiple: true
      - name: Test summary (fails if any test failed)
        run: python scripts/junit_summary.py unit-results --output unit-summary.md && cat unit-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Combined coverage
        if: always()
        run: |
          coverage combine unit-results/.coverage.*
          { echo "## Coverage"; echo; echo '```'; coverage report --skip-empty; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          coverage xml -o coverage.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-report
          path: |
            unit-summary.md
            coverage.xml

  # ═══ Stage 3 · Container ═══════════════════════════════════════════════════
  docker-build:
    name: "Container · Build image"
    needs: [lint, format, test-report]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (layers cached for the next jobs)
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: devops-agent:ci
          cache-to: type=gha,mode=max
          cache-from: type=gha
          load: true
      - name: Image size
        run: docker image ls devops-agent:ci --format '{{.Repository}}:{{.Tag}} {{.Size}}' | tee -a "$GITHUB_STEP_SUMMARY"

  docker-smoke:
    name: "Container · Healthcheck & import smoke test"
    needs: docker-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Load image from build cache
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: devops-agent:ci
          cache-from: type=gha
          load: true
      - name: Healthcheck (scripts/healthcheck.py)
        run: |
          docker run --rm -e GROQ_API_KEY=ci-placeholder -e TAVILY_API_KEY=ci-placeholder \
            -e LANGFUSE_PUBLIC_KEY=pk-lf-ci -e LANGFUSE_SECRET_KEY=sk-lf-ci \
            -e LANGFUSE_BASE_URL=http://127.0.0.1:1 devops-agent:ci python scripts/healthcheck.py
      - name: Import smoke test
        run: |
          docker run --rm -e GROQ_API_KEY=ci-placeholder -e TAVILY_API_KEY=ci-placeholder \
            -e LANGFUSE_PUBLIC_KEY=pk-lf-ci -e LANGFUSE_SECRET_KEY=sk-lf-ci \
            -e LANGFUSE_BASE_URL=http://127.0.0.1:1 devops-agent:ci \
            python -c "import main, tools.rag_tool, monitoring.eval_runner, monitoring.langfuse_exporter; print('imports ok')"
      - name: Runs as non-root
        run: test "$(docker run --rm devops-agent:ci id -u)" = "1000"

  image-scan:
    name: "Security · Image scan (Trivy, advisory)"
    needs: docker-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Load image from build cache
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: devops-agent:ci
          cache-from: type=gha
          load: true
      - name: Trivy (HIGH/CRITICAL, fixed only; advisory)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.56.2 \
            image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 0 --format table \
            --scanners vuln devops-agent:ci | tee trivy.txt
          { echo "## Image scan (advisory)"; echo; echo '```'; tail -n 60 trivy.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  # ═══ Stage 4 · Live evaluation (Groq + Tavily + RAG + Langfuse) ════════════
  eval-preflight:
    name: "Live eval · Preflight (secrets, mode, groups)"
    needs: test-report
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      available: ${{ steps.check.outputs.available }}
      critical_flag: ${{ steps.check.outputs.critical_flag }}
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
    steps:
      - id: check
        run: |
          if [ -n "$GROQ_API_KEY" ] && [ -n "$TAVILY_API_KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "::warning::GROQ_API_KEY/TAVILY_API_KEY unavailable (fork PR) - live evaluation NOT run"
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::GROQ_API_KEY and TAVILY_API_KEY repository secrets are required"
            exit 1
          fi
          # Groq free tier: 200k tokens/day for gpt-oss-120b. Pushes run the critical cases.
          if [ "${{ inputs.full_eval }}" = "true" ]; then
            echo "critical_flag=" >> "$GITHUB_OUTPUT"; echo "Mode: full suite" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "critical_flag=--critical-only" >> "$GITHUB_OUTPUT"; echo "Mode: critical cases only" >> "$GITHUB_STEP_SUMMARY"
          fi

  live-eval:
    name: "Live eval · ${{ matrix.group.name }}"
    needs: eval-preflight
    if: needs.eval-preflight.outputs.available == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2          # stay under Groq's tokens-per-minute limit
      matrix:
        group:
          - { name: "RAG knowledge base", slug: "rag", prefix: "RAG" }
          - { name: "Web search (Tavily)", slug: "web", prefix: "WEB" }
          - { name: "Routing KB+web & unknowns", slug: "routing-unknown", prefix: "BOTH,UNK" }
          - { name: "Safety & off-domain", slug: "safety", prefix: "SEC,OFF" }
          - { name: "Robustness, memory & general", slug: "robustness", prefix: "ROB,MEM,GEN" }
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      EVAL_MIN_PASS_RATE: "0.8"
      EVAL_CASE_DELAY: "10"
    steps:
      - uses: actions/checkout@v4
      - name: Start ephemeral Langfuse v4
        uses: ./.github/actions/start-langfuse
        with:
          compose-ref: ${{ env.LANGFUSE_COMPOSE_REF }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked dependencies
        run: pip install -r requirements.lock
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-all-MiniLM-L6-v2-v1
      - name: Evaluate ${{ matrix.group.prefix }} (exit 1 failed, 2 blocked)
        run: >
          python -m evals.run_eval --prefix "${{ matrix.group.prefix }}"
          ${{ needs.eval-preflight.outputs.critical_flag }}
          --output-dir reports/eval-${{ matrix.group.slug }}
      - name: Score quality gate over Langfuse (v3 scores API)
        run: python -m monitoring.eval_runner
      - name: Group report to job summary
        if: always()
        run: cat reports/eval-${{ matrix.group.slug }}/eval_report.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "no report" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-${{ matrix.group.slug }}
          path: reports/
          if-no-files-found: warn
      - name: Langfuse logs on failure
        if: failure()
        run: cd /tmp/langfuse && docker compose logs --tail 100 langfuse-web langfuse-worker

  eval-report:
    name: "Live eval · Combined report & gate"
    needs: [eval-preflight, live-eval]
    if: always() && needs.eval-preflight.outputs.available == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          pattern: eval-*
          path: eval-results
      - name: Merge group reports (exit 1 failed, 2 blocked)
        run: |
          set +e
          python -m evals.merge_reports eval-results --output-dir reports/combined
          code=$?
          cat reports/combined/eval_report.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null
          exit $code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report-combined
          path: reports/combined/

  # ═══ Stage 5 · Summary ═════════════════════════════════════════════════════
  pipeline-summary:
    name: "Pipeline summary"
    needs: [lint, format, secret-scan, dependency-audit, unit, test-report, docker-build,
            docker-smoke, image-scan, eval-preflight, live-eval, eval-report]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Job results table
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          icons = {"success": "✅", "failure": "❌", "cancelled": "⏹️", "skipped": "⏭️"}
          needs = json.loads(os.environ["NEEDS"])
          print("## Pipeline summary\n\n| Job | Result |\n|---|---|")
          for job, info in needs.items():
              r = info["result"]
              print(f"| {job} | {icons.get(r, '')} {r} |")
          PY
